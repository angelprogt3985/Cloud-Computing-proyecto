name: Validate Glacier Quest
on:
  push:
    branches: [main, codex/preentrega-iam-actions]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: glacierquest
    steps:
      - uses: actions/checkout@v4
      - name: Record repository identity for restricted federation
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          {
            echo '## Repository identity (not credentials)'
            printf 'Repository: `%s`\n\nRepository ID: `%s`\n\nOwner ID: `%s`\n' "$REPOSITORY" "$REPOSITORY_ID" "$OWNER_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: glacierquest/api/package-lock.json
      - run: npm ci --ignore-scripts --prefix api
      - name: Tests with retained report
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --test --test-reporter=tap api/test/*.test.js | tee evidence/tests.tap
      - name: Build container without publishing
        run: docker build -t glacierquest:test .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-tests-${{ github.run_id }}
          path: glacierquest/evidence/tests.tap
          retention-days: 7
          if-no-files-found: ignore
      - name: Describe actual scope
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Preentrega: continuous integration'
            echo "Commit: $GITHUB_SHA"
            echo "Job status before this summary: $JOB_STATUS"
            echo 'Memory-store HTTP/game tests and cache tests; Docker build; Terraform validation.'
            echo 'No deployment, Terraform apply, Firestore integration test or GCP authentication.'
            echo 'This run is not evidence of two deployed cloud services.'
          } >> "$GITHUB_STEP_SUMMARY"
