name: Validate Glacier Quest
on:
  push:
    branches: [main, codex/preentrega-iam-actions]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: glacierquest
    steps:
      - uses: actions/checkout@v4
      - name: Record repository identity for restricted federation
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          {
            echo '## Repository identity (not credentials)'
            printf 'Repository: `%s`\n\nRepository ID: `%s`\n\nOwner ID: `%s`\n' "$REPOSITORY" "$REPOSITORY_ID" "$OWNER_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: glacierquest/api/package-lock.json
      - run: npm ci --ignore-scripts --prefix api
      - name: Build container without publishing
        run: docker build -t glacierquest:delivery .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - name: Describe actual scope
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Final delivery: build validation'
            echo "Commit: $GITHUB_SHA"
            echo "Job status before this summary: $JOB_STATUS"
            echo 'Docker build and Terraform format/configuration validation.'
            echo 'No deployment, Terraform apply or GCP authentication.'
            echo 'This workflow validates packaging; it does not run gameplay tests.'
          } >> "$GITHUB_STEP_SUMMARY"
