name: Verify Google Cloud identity (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: verify-cloud-identity
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with short-lived credentials
        uses: google-github-actions/auth@v3
        with:
          project_id: glacier-quest-1791678996
          workload_identity_provider: projects/636305098699/locations/global/workloadIdentityPools/glacierquest-github/providers/github
          service_account: glacierquest-deploy@glacier-quest-1791678996.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
      - name: Record successful authentication without exposing credentials
        run: |
          {
            echo '## IAM connection verified'
            echo 'GitHub OIDC was exchanged for a short-lived Google Cloud service-account token.'
            echo 'Project: glacier-quest-1791678996'
            echo 'Identity: glacierquest-deploy'
            echo 'No game deployment, resource creation, database access, image upload or Terraform apply.'
            echo 'This proves authentication, not deployment or access to game resources.'
          } >> "$GITHUB_STEP_SUMMARY"
