<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glacier Quest</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #FAFAF8;
    color: #2C2C2A;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .app { width: 660px; }
  .frame {
    background: #FAFAF8;
    border: 1px solid #B4B2A9;
    border-radius: 10px;
    padding: 10px;
  }
  #hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #FFFFFF;
    border: 1px solid #D3D1C7;
    border-radius: 6px;
    padding: 6px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  #hud-coins::before { content: "🪙 "; }
  canvas {
    display: block;
    border-radius: 6px;
    border: 1px solid #B5D4F4;
  }
  #hint-bar {
    text-align: center;
    font-size: 11px;
    color: #5F5E5A;
    background: #FFFFFF;
    border: 1px solid #D3D1C7;
    border-radius: 5px;
    padding: 4px;
    margin-top: 8px;
  }
  .panels { display: flex; gap: 10px; margin-top: 10px; }
  .panel {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid #D3D1C7;
    border-radius: 6px;
    padding: 8px;
  }
  .panel h3 { margin: 0 0 6px; font-size: 12px; color: #5F5E5A; }
  #chat-list { height: 80px; overflow-y: auto; font-size: 12px; margin-bottom: 6px; }
  #chat-list p { margin: 0 0 4px; }
  #chat-form { display: flex; gap: 6px; }
  #chat-input { flex: 1; font-size: 12px; padding: 4px; }
  .inv-pill {
    display: inline-block;
    background: #EAF3DE;
    border: 1px solid #3B6D11;
    color: #27500A;
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 11px;
    margin: 2px 4px 2px 0;
  }
  .inv-empty { font-size: 11px; color: #888580; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 18, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #FFFFFF;
    border-radius: 8px;
    padding: 20px;
    width: 280px;
    text-align: center;
  }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal input {
    width: 100%;
    padding: 6px;
    margin: 10px 0;
    font-size: 13px;
  }
  .modal button {
    padding: 6px 14px;
    margin: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  #join-error { color: #B3261E; font-size: 12px; min-height: 16px; }
  #battle-log { font-size: 13px; min-height: 36px; margin: 8px 0; }
</style>
</head>
<body>

<div class="app">
  <div class="frame">
    <div id="hud-bar">
      <span id="hud-name">—</span>
      <span id="hud-coins">0</span>
    </div>
    <canvas id="map-canvas" width="640" height="400"></canvas>
    <div id="hint-bar">Arrow keys to move · walk over a tile to collect it</div>

    <div class="panels">
      <div class="panel">
        <h3>Chat</h3>
        <div id="chat-list"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="140" placeholder="Say something..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
      </div>
      <div class="panel">
        <h3>Inventory</h3>
        <div id="inventory-list"><span class="inv-empty">Nothing yet</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Join screen -->
<div id="join-overlay" class="overlay">
  <div class="modal">
    <h2>Welcome to Glacier Quest</h2>
    <form id="join-form">
      <input id="join-name" type="text" maxlength="32" placeholder="Choose a name" autocomplete="off" required>
      <div id="join-error"></div>
      <button type="submit">Join the plaza</button>
    </form>
  </div>
</div>

<!-- Battle screen -->
<div id="battle-overlay" class="overlay hidden">
  <div class="modal">
    <h2>The Old Sage</h2>
    <div id="battle-log"></div>
    <button id="battle-attack">Attack</button>
    <button id="battle-run">Run</button>
    <br>
    <button id="battle-leave">Leave</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
