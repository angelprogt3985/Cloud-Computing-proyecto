services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glacierquest
      POSTGRES_USER: glacierquest
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - glacierquest-data:/var/lib/postgresql/data
      - ./api/sql/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glacierquest -d glacierquest"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  glacierquest-data:
